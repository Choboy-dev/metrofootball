<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Metro Football</title>
  <meta name="description" content="Your Metro Football dashboard.">
  <link rel="canonical" href="https://metrofootball.co.uk/dashboard">
  <link rel="icon" href="./images/metro-football-favicon.png" type="image/png" sizes="500x500">
  <link rel="apple-touch-icon" href="./images/metro-football-favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Metro Football">
  <meta property="og:title" content="Dashboard | Metro Football">
  <meta property="og:description" content="Your Metro Football dashboard.">
  <meta property="og:url" content="https://metrofootball.co.uk/dashboard">
  <meta property="og:image" content="https://metrofootball.co.uk/images/metro-football-favicon.png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Dashboard | Metro Football">
  <meta name="twitter:description" content="Your Metro Football dashboard.">
  <meta name="twitter:image" content="https://metrofootball.co.uk/images/metro-football-favicon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="auth-page" data-auth-page="dashboard">
  <section class="auth-shell">
    <div class="auth-card">
      <div class="auth-card__brand">
        <a href="./" class="site-logo" aria-label="Metro Football home">
          <img class="site-logo__img" src="./images/metro-football-logo-dark.png" alt="" width="320" height="107" decoding="async">
        </a>
        <h1 class="auth-card__title">You are in</h1>
        <p class="auth-card__lead">Signed in as <strong data-user-email></strong>. Your free tools are ready in the dashboard.</p>
      </div>
      <a class="mf-btn mf-btn--primary mf-btn--block" href="./">
        <span class="mf-btn__label">Back to home</span>
        <span class="mf-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
      <a class="mf-btn mf-btn--ink mf-btn--block" href="#" data-logout>
        <span class="mf-btn__label">Log out</span>
        <span class="mf-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </section>
  <script type="module" src="./js/guard.js"></script>
</body>
</html>
