<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="FPL hit cost minus 4 points must be recovered within two gameweeks to break even">
  <rect width="700" height="360" rx="16" fill="#0b1220"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">TRANSFERS</text>
  <text x="36" y="78" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="26" font-weight="700">The two gameweek payback rule</text>

  <g transform="translate(36 110)">
    <rect width="190" height="160" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <text x="95" y="48" fill="#fecaca" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="36" font-weight="700">-4</text>
    <text x="95" y="78" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">Hit cost now</text>
    <text x="95" y="130" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="12">Extra transfer</text>
  </g>

  <text x="260" y="198" fill="#64748b" font-family="Google Sans, sans-serif" font-size="28" font-weight="700">=</text>

  <g transform="translate(300 110)">
    <rect width="190" height="160" rx="16" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <text x="95" y="48" fill="#6ee7b7" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="36" font-weight="700">+4</text>
    <text x="95" y="78" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">Minimum gain</text>
    <text x="95" y="130" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="12">Over the next 2 gameweeks</text>
  </g>

  <g transform="translate(520 110)">
    <rect width="144" height="160" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="72" y="70" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">New player must</text>
    <text x="72" y="92" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">outscore sold</text>
    <text x="72" y="114" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">player by 4+</text>
    <text x="72" y="142" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">combined</text>
  </g>

  <rect x="36" y="296" width="628" height="44" rx="12" fill="rgba(220,38,38,0.1)" stroke="rgba(220,38,38,0.25)" stroke-width="1"/>
  <text x="350" y="324" fill="#fecaca" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Two hits in one week need +8 points over two gameweeks to break even</text>
</svg>
