<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="FPL goal points by position: forwards 4, midfielders 5, defenders and goalkeepers 6">
  <rect width="700" height="340" rx="16" fill="#0b1220"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">SCORING</text>
  <text x="36" y="78" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="26" font-weight="700">Goals by position</text>

  <g transform="translate(36 110)">
    <text x="0" y="20" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="600">Forwards</text>
    <rect x="0" y="32" width="520" height="28" rx="8" fill="#1e293b"/>
    <rect x="0" y="32" width="208" height="28" rx="8" fill="#dc2626"/>
    <text x="540" y="52" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="20" font-weight="700">4 pts</text>
  </g>
  <g transform="translate(36 170)">
    <text x="0" y="20" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="600">Midfielders</text>
    <rect x="0" y="32" width="520" height="28" rx="8" fill="#1e293b"/>
    <rect x="0" y="32" width="260" height="28" rx="8" fill="#b45309"/>
    <text x="540" y="52" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="20" font-weight="700">5 pts</text>
  </g>
  <g transform="translate(36 230)">
    <text x="0" y="20" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="600">Defenders &amp; GKs</text>
    <rect x="0" y="32" width="520" height="28" rx="8" fill="#1e293b"/>
    <rect x="0" y="32" width="312" height="28" rx="8" fill="#059669"/>
    <text x="540" y="52" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="20" font-weight="700">6 pts</text>
  </g>

  <text x="350" y="318" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Assists are 3 points for every position</text>
</svg>
