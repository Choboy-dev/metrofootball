<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="Weekly FPL deadline workflow from Monday through final team news before kickoff">
  <rect width="700" height="300" rx="16" fill="#0b1220"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">DEADLINE ROUTINE</text>
  <text x="36" y="78" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="24" font-weight="700">Your weekly workflow</text>

  <line x1="56" y1="170" x2="644" y2="170" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(48 118)">
    <circle cx="0" cy="52" r="14" fill="#334155"/>
    <text x="0" y="100" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Mon-Wed</text>
    <text x="0" y="120" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Injuries</text>
  </g>
  <g transform="translate(198 118)">
    <circle cx="0" cy="52" r="14" fill="#334155"/>
    <text x="0" y="100" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Thursday</text>
    <text x="0" y="120" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Fixtures</text>
  </g>
  <g transform="translate(348 118)">
    <circle cx="0" cy="52" r="14" fill="#334155"/>
    <text x="0" y="100" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600">Friday</text>
    <text x="0" y="120" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Captain</text>
  </g>
  <g transform="translate(498 118)">
    <circle cx="0" cy="52" r="18" fill="#dc2626"/>
    <text x="0" y="100" fill="#fecaca" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700">Final hour</text>
    <text x="0" y="120" fill="#cbd5e1" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Lineups</text>
  </g>

  <rect x="36" y="248" width="628" height="36" rx="10" fill="#1e293b"/>
  <text x="350" y="271" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Late team news can flip your captain. Check once more before the deadline locks.</text>
</svg>
