<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="Captain pick framework weighing minutes, expected goals and assists, fixtures, and rotation risk">
  <rect width="700" height="340" rx="16" fill="#0b1220"/>
  <text x="36" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">CAPTAINCY</text>
  <text x="36" y="78" fill="#f8fafc" font-family="Google Sans, sans-serif" font-size="26" font-weight="700">Captain scoring framework</text>

  <g transform="translate(36 108)">
    <rect width="140" height="160" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <text x="70" y="56" fill="#dc2626" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="28" font-weight="700">1</text>
    <text x="70" y="88" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Minutes</text>
    <text x="70" y="112" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Will they start?</text>
  </g>
  <g transform="translate(196 108)">
    <rect width="140" height="160" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="70" y="56" fill="#f8fafc" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="28" font-weight="700">2</text>
    <text x="70" y="88" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">xG / xA</text>
    <text x="70" y="112" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Underlying threat</text>
  </g>
  <g transform="translate(356 108)">
    <rect width="140" height="160" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="70" y="56" fill="#f8fafc" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="28" font-weight="700">3</text>
    <text x="70" y="88" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Fixture</text>
    <text x="70" y="112" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Home and opponent</text>
  </g>
  <g transform="translate(516 108)">
    <rect width="148" height="160" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="74" y="56" fill="#f8fafc" text-anchor="middle" font-family="Google Sans, sans-serif" font-size="28" font-weight="700">4</text>
    <text x="74" y="88" fill="#f8fafc" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600">Rotation</text>
    <text x="74" y="112" fill="#94a3b8" text-anchor="middle" font-family="Inter, sans-serif" font-size="11">Rest and injuries</text>
  </g>

  <rect x="36" y="292" width="628" height="36" rx="10" fill="rgba(220,38,38,0.1)" stroke="rgba(220,38,38,0.25)" stroke-width="1"/>
  <text x="350" y="315" fill="#fecaca" text-anchor="middle" font-family="Inter, sans-serif" font-size="13">Minutes first. Do not captain a doubtful player.</text>
</svg>
